name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly deeper properties/release-mode run and advisory refresh.
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded push/PR runs, but never let an ordinary main push cancel a
# scheduled or manually requested deep/mutation run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Only first-party actions/checkout is used; the toolchain is installed
      # via the runner's preinstalled rustup rather than a marketplace action,
      # keeping CI's supply-chain surface minimal (on-brand for this project).
      - uses: actions/checkout@v7

      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Clippy (warnings are errors)
        run: ./scripts/ci static

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS is a correctness target, not cosmetic: dogfooding uses it and
        # ASF relies on Unix sockets, flock, hard links, modes, signals, and
        # filesystem semantics that differ from Linux.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Tests and executable acceptance demos
        run: ./scripts/ci test

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: RustSec dependency audit
        run: ./scripts/ci audit

  deep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Release-mode tests with deeper generated histories
        run: ./scripts/ci deep

  mutation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked --version 27.1.0

      - name: Mutation test authority evaluation and merge policy
        run: ./scripts/ci mutation

# Deliberately NOT enforcing `cargo fmt --check` yet: the tree is not
# rustfmt-clean, and reformatting belongs in its own PR, not bundled here.
# Track: enable fmt-check after a dedicated `cargo fmt` pass.
